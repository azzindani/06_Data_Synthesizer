# Legal Corpus Generation (Gemini) - mirrored from corpusgen-legal-gemini-prodv1.ipynb

domain:
  name: "Comprehensive Legal Corpus"
  target_language: "en"
  generation_mode: "full_document"
  include_sentiment_analysis: true
  approach: "no_source"
  num_variants: 1
  max_text_length: 15000
  min_text_length: 200

