# General Synthesis (Structured Reasoning) Configuration

domain:
  name: "General Structured Reasoning"
  description: "Generate QA pairs with explicit reasoning steps"
  language: "en"

topics:
  - "Finance operations"
  - "Operations management"
  - "AI governance"
  - "Customer success"
  - "Sustainability"

system_prompt: |
  You are a reasoning assistant generating QA pairs with explicit, step-by-step
  logic. Keep the reasoning compact but complete.

prompt_template: |
  Generate {num_variants} QA pairs for topic: "{topic}".

  REQUIREMENTS:
  1. Provide reasoning steps (step-by-step)
  2. Keep answers at least {min_answer_length} words
  3. Keep reasoning formatted as a short list

  FORMAT JSON:
  [
    {{"question": "...", "answer": "...", "reasoning": "- step 1\n- step 2"}}
  ]

quality:
  min_answer_length: 100
  max_answer_length: 1500
  min_question_length: 12
  target_language: "en"
  language_confidence: 0.8
