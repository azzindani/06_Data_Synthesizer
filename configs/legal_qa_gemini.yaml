# Legal QA Synthesis Configuration (Gemini)

domain:
  name: "Legal QA Synthesis"
  description: "Generate legal QA pairs for domain-specific topics"
  language: "en"

topics:
  - "Contract law fundamentals"
  - "Liability and indemnity"
  - "Employment agreements"
  - "Privacy regulations"
  - "IP licensing"

system_prompt: |
  You are a legal expert creating precise QA pairs. Keep questions clear and
  answers detailed and grounded in legal principles.

prompt_template: |
  Generate {num_variants} QA pairs for topic: "{topic}".

  REQUIREMENTS:
  1. Answers must be at least {min_answer_length} words
  2. Use formal legal language
  3. Provide practical guidance where appropriate

  FORMAT JSON:
  [
    {{"question": "...", "answer": "..."}}
  ]

quality:
  min_answer_length: 120
  max_answer_length: 1500
  min_question_length: 12
  target_language: "en"
  language_confidence: 0.8
