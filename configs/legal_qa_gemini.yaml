# Legal QA Synthesis (Gemini) - mirrored from legal-qa-syn-gemini-prod-v1.ipynb

meta:
  name: "legal-qa-gemini"
  description: "Source-grounded Indonesian Legal QA augmentation from existing QA dataset"
  version: "1.0"
  synthesis_type: "source_qa"

domain:
  name: "Indonesian Legal QA Augmentation"
  target_language: "id"
  num_variants: 5

prompts:
  prompt_template: |
    Anda adalah ahli hukum Indonesia senior. Buat {num_variants} variasi berkualitas tinggi dari Q&A
    hukum berikut:

    MATERI ASLI:{context_part}
    Q: {question}
    A: {answer}

    PERSYARATAN:
    1. Setiap jawaban minimal {min_answer_words} kata
    2. Pertahankan SEMUA kutipan hukum (Pasal, UU, PP, dll.)
    3. Pertahankan terminologi hukum Indonesia
    4. Gunakan bahasa formal dan analisis mendalam
    5. Setiap variasi berbeda pendekatan tapi substansi sama

    VARIASI:
    - Akademik: analisis teoretis mendalam
    - Praktis: aplikasi dalam praktik hukum
    - Komparatif: hubungan dengan peraturan lain

    FORMAT JSON:
    {json_template}

    Berikan HANYA JSON array yang valid.

  json_template: |
    [
      {"question": "variasi 1", "answer": "jawaban lengkap 1"},
      {"question": "variasi 2", "answer": "jawaban lengkap 2"}
    ]

schema:
  columns:
    - {name: question,        type: string, source: generated, required: true}
    - {name: answer,          type: string, source: generated, required: true}
    - {name: source_question, type: string, source: input,     required: false}
    - {name: source_answer,   type: string, source: input,     required: false}
    - {name: overall_score,   type: float,  source: computed,  required: false}
    - {name: question_length, type: int,    source: computed,  required: false}
    - {name: answer_length,   type: int,    source: computed,  required: false}
    - {name: timestamp,       type: string, source: metadata,  required: false}
    - {name: provider,        type: string, source: metadata,  required: false}

run_config:
  input_repository: "${INPUT_REPO:-Azzindani/Indonesian_Legal_QA}"
  output_repository: "${OUTPUT_REPO:-Azzindani/ID_Legal_Bench}"
  question_column: "question"
  answer_column: "answer"
  corpus_column: "Answer"   # column in source dataset used as context text
  context_column: null
  citation_column: null
  preserve_columns: []
  chunk_size: 20
  model_name: "gemini-2.5-flash"
  temperature: 0.6
  input_token_limit: 10000
  output_token_limit: "num_variants * 4000"
  min_question_length: 15
  min_answer_length: 50
  max_question_length: 2000
  max_answer_length: 8000
  min_overall_score: 0.60
  data_dir: "./data/"
  progress_file: "progress.json"

quality:
  min_question_length: 15
  min_answer_length: 50
  max_question_length: 2000
  max_answer_length: 8000
  target_language: "id"
