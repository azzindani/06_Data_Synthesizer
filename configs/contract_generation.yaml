# Contract/Document Generation Domain Configuration

domain:
  name: "Legal Contract Corpus"
  description: "Generate realistic legal contracts and agreements"
  language: "en"
  min_document_length: 2000

taxonomy:
  document_types:
    - "Non-Disclosure Agreement (NDA)"
    - "Master Services Agreement (MSA)"
    - "Software License Agreement (EULA)"
    - "Employment Agreement"
    - "Partnership Agreement"
    - "Consulting Agreement"
    - "Service Level Agreement (SLA)"
    - "Supply Agreement"

  industries:
    - "Information Technology"
    - "Financial Services"
    - "Healthcare"
    - "Manufacturing"
    - "Retail & E-commerce"
    - "Energy & Utilities"

  jurisdictions:
    - "US Federal & State Law"
    - "UK Law"
    - "EU Law"
    - "Singapore Law"
    - "Australian Law"

  metadata:
    risk_profile:
      - "Low"
      - "Medium"
      - "High"
    duration:
      - "<1 year"
      - "1-3 years"
      - "3-5 years"
      - "5+ years"
    contract_value:
      - "<50K"
      - "50K-500K"
      - "500K-5M"
      - ">5M USD"

system_prompt: |
  You are a senior commercial attorney with 20+ years of experience drafting
  complex agreements across multiple industries and jurisdictions.

  You draft realistic, enforceable contracts that reflect actual business
  negotiations - not generic templates. Your contracts include:
  - Specific commercial terms with real numbers
  - Industry-appropriate provisions and standards
  - Natural language variations (not formulaic)
  - Realistic party dynamics and negotiated positions
  - Proper legal structure for the jurisdiction

prompt_template: |
  Generate a complete, realistic {document_type} for the {industry} industry.

  CONTEXT:
  - Governing Law: {jurisdiction}
  - Risk Profile: {risk_profile}
  - Duration: {duration}
  - Value: {contract_value}

  REQUIREMENTS:
  1. Document must be at least {min_document_length} words
  2. Include all standard sections for this document type
  3. Use realistic party names and specific terms
  4. Follow proper legal document structure

  Generate the complete document now.

quality:
  min_document_length: 2000
  target_language: "en"
