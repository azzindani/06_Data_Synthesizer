# Gemini Any (Syn) - mirrored from gemini-any-syn-prod-v1.ipynb

domain:
  name: "Indonesian Legal System"
  target_language: "id"
  num_variants: 5

  topics:
    - "Hukum Pidana dan Sanksi"
    - "Hukum Perdata dan Kontrak"
    - "Hukum Tata Negara dan Konstitusi"
    - "Hukum Keluarga dan Perkawinan"
    - "Hukum Bisnis dan Perdagangan"
    - "Hukum Ketenagakerjaan"
    - "Hukum Lingkungan"
    - "Hukum HAM dan Kebebasan Sipil"
    - "Prosedur Pengadilan"
    - "Hukum Properti dan Tanah"

prompts:
  system_prompt: |
    Anda adalah seorang ahli hukum Indonesia yang berpengalaman dengan pemahaman mendalam tentang
    sistem hukum Indonesia. Tugas Anda adalah membuat pasangan pertanyaan-jawaban berkualitas tinggi
    untuk membantu orang memahami berbagai aspek hukum Indonesia.

  prompt_template: |
    Buat {num_variants} pasangan pertanyaan-jawaban berkualitas tinggi tentang topik: "{topic}"

    PERSYARATAN:
    1. Setiap jawaban minimal 100 kata, maksimal 2000 kata
    2. Gunakan bahasa Indonesia yang formal dan tepat
    3. Sertakan rujukan hukum yang relevan (pasal, undang-undang, peraturan)
    4. Gunakan terminologi hukum Indonesia yang benar
    5. Berikan penjelasan yang komprehensif dan akurat
    6. Setiap QA pair berbeda pendekatan tapi relevan dengan topik
    7. Variasi tingkat kesulitan (dasar hingga lanjutan)

    JENIS VARIASI:
    - Definisi dan konsep dasar
    - Prosedur dan mekanisme hukum
    - Analisis kasus praktis
    - Perbandingan dengan peraturan lain
    - Aplikasi dalam kehidupan sehari-hari

    FORMAT JSON:
    {json_template}

    Berikan HANYA JSON array yang valid tanpa penjelasan tambahan.

  json_template: |
    [
      {"question": "pertanyaan 1 tentang {topic}", "answer": "jawaban lengkap dan komprehensif 1"},
      {"question": "pertanyaan 2 tentang {topic}", "answer": "jawaban lengkap dan komprehensif 2"}
    ]

quality:
  min_answer_length: 100
  max_answer_length: 2000
  target_language: "id"
  language_confidence: 0.8

notebook_config:
  output_repository: "Azzindani/ID_Legal_QA_Syn"
  model_name: "gemini-2.5-flash"
  temperature: 0.7
  max_output_tokens: 65536
  questions_per_topic: 50
  chunk_size: 20
  target_language_confidence: 0.8
  progress_file: "synthesis_progress.json"
