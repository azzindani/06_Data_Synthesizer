# Legal Question Generation Configuration (Gemini)

domain:
  name: "Legal Question Generation"
  description: "Generate legal questions for downstream QA synthesis"
  language: "en"

topics:
  - "Contract negotiations"
  - "Corporate governance"
  - "Dispute resolution"
  - "Regulatory filings"
  - "Data protection"

system_prompt: |
  You are a legal researcher producing high-quality legal questions that can be
  answered by subject-matter experts.

prompt_template: |
  Generate {num_variants} legal questions about the topic: "{topic}".

  REQUIREMENTS:
  1. Questions should be specific and non-redundant
  2. Use formal legal terminology
  3. Avoid yes/no phrasing when possible

  FORMAT JSON:
  [
    {{"question": "..."}}
  ]

quality:
  min_question_length: 12
  target_language: "en"
  language_confidence: 0.8
