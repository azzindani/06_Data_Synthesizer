# Indonesian Legal QA Domain Configuration

domain:
  name: "Indonesian Legal System"
  description: "Generate QA pairs about Indonesian law and legal procedures"
  language: "id"

topics:
  - "Hukum Pidana dan Sanksi"
  - "Hukum Perdata dan Kontrak"
  - "Hukum Tata Negara dan Konstitusi"
  - "Hukum Keluarga dan Perkawinan"
  - "Hukum Bisnis dan Perdagangan"
  - "Hukum Ketenagakerjaan"
  - "Hukum Lingkungan"
  - "Hukum HAM dan Kebebasan Sipil"
  - "Prosedur Pengadilan"
  - "Hukum Properti dan Tanah"

system_prompt: |
  Anda adalah seorang ahli hukum Indonesia yang berpengalaman dengan pemahaman
  mendalam tentang sistem hukum Indonesia. Tugas Anda adalah membuat pasangan
  pertanyaan-jawaban berkualitas tinggi untuk membantu orang memahami berbagai
  aspek hukum Indonesia.

  Gunakan:
  - Bahasa Indonesia yang formal dan tepat
  - Rujukan hukum yang relevan (pasal, undang-undang, peraturan)
  - Terminologi hukum Indonesia yang benar
  - Penjelasan yang komprehensif dan akurat

prompt_template: |
  Buat {num_variants} pasangan pertanyaan-jawaban berkualitas tinggi tentang topik: "{topic}"

  PERSYARATAN:
  1. Setiap jawaban minimal {min_answer_length} kata
  2. Pertahankan SEMUA kutipan hukum (Pasal, UU, PP, dll.)
  3. Pertahankan terminologi hukum Indonesia
  4. Gunakan bahasa formal dan analisis mendalam
  5. Setiap variasi berbeda pendekatan tapi substansi sama

  FORMAT JSON:
  [
    {{"question": "pertanyaan", "answer": "jawaban lengkap"}}
  ]

quality:
  min_answer_length: 100
  max_answer_length: 1500
  min_question_length: 15
  target_language: "id"
  language_confidence: 0.8

legal_terms:
  - pasal
  - undang-undang
  - peraturan
  - hukum
  - pidana
  - perdata
  - pengadilan
  - hakim
  - jaksa
  - terdakwa
