# Data Synthesizer Configuration
# Copy this file and modify for your use case

app:
  name: "data-synthesizer"
  mode: "production"  # development | production
  log_level: "INFO"

# Provider configuration
providers:
  primary: "gemini"
  fallback: ["openrouter"]
  auto_switch: true

  gemini:
    model: "gemini-2.5-flash"
    temperature: 0.7
    max_output_tokens: 65536
    top_p: 0.8
    top_k: 40
    rate_limit_delay: 4  # seconds between requests

  openrouter:
    model: "google/gemini-flash-1.5"
    temperature: 0.7
    max_output_tokens: 65536
    top_p: 0.8
    rate_limit_delay: 2

# Synthesis settings
synthesis:
  type: "qa"  # qa | deep_thinking | corpus
  domain_config: ""
  batch_size: 5
  questions_per_topic: 50
  num_variants: 5

# Output settings
output:
  type: "huggingface"  # huggingface | local | both
  repository: "username/dataset-name"  # Change this!
  local_path: "./output"
  chunk_format: "parquet"
  progress_file: "synthesis_progress.json"

# Quality settings
quality:
  min_answer_length: 100
  max_answer_length: 2000
  min_question_length: 15
  max_question_length: 1500
  target_language: "id"
  language_confidence: 0.8
  min_quality_score: 0.6

# Retry settings
retry:
  max_attempts: 5
  base_delay: 2
  max_delay: 60
  exponential_base: 2

# Domain configuration (customize for your use case)
domain:
  domain: "Indonesian Legal System"
  topics:
    - "Hukum Pidana dan Sanksi"
    - "Hukum Perdata dan Kontrak"
    - "Hukum Tata Negara dan Konstitusi"
    - "Hukum Keluarga dan Perkawinan"
    - "Hukum Bisnis dan Perdagangan"
    - "Hukum Ketenagakerjaan"
    - "Hukum Lingkungan"
    - "Hukum HAM dan Kebebasan Sipil"
    - "Prosedur Pengadilan"
    - "Hukum Properti dan Tanah"
